<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Projetinho" content="Primeiro projeto html">
    <title>PARABÉNS</title>
    <style>
        .imagem-container{
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden; 
        }
        .imagem-container img {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="imagem-container">
        <img src="assets/ezgif.com-video-to-gif-converter.gif" alt="imagem animada">
    </div>
</body>
</html>
