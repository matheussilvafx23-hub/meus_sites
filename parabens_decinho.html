<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabéns</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .imagem-container {
      position: relative;
      width: 100%;
      height: 60vh; /* usa sua ideia original */
      max-height: 400px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .imagem-container img {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
    }

    .botao {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #ff813f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="imagem-container">
      <img src="assets/ezgif.com-video-to-gif-converter.gif" alt="imagem animada">
    </div>

    <h1>Parabéns 🎉</h1>
    <p>Você chegou até aqui. Agora é hora de dar o próximo passo, clique abaixo.</p>

    <a href="#" class="botao">Continuar te amando</a>

  </div>

</body>
</html>
